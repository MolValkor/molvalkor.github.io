:root{
  --coral:#df4633; --paper:#f2ede7; --cream:#e8e0d1; --gold:#caac81; --espresso:#4d3b2d; --black:#000;
  --ink:#2b211a; --muted:#6f6052; --line:#ddd1bf; --card:#fffdf9; --coral-soft:#f7d9d2; --gold-soft:#efe3cf;
  --head:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --body:'Karla',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.55;-webkit-font-smoothing:antialiased;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--head);line-height:1.15;margin:0 0 .4em;color:var(--espresso)}
h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.5px}
h2{font-size:clamp(22px,3.4vw,30px);font-weight:800;letter-spacing:-.3px}
h3{font-size:18px;font-weight:700}
em.script{font-family:var(--body);font-style:italic;font-weight:400;color:var(--coral)}
.muted{color:var(--muted)}
.proto-flag{background:var(--espresso);color:var(--cream);font-size:12px;text-align:center;padding:5px 10px;letter-spacing:.3px}
/* top bar + step bar (YVV pattern) */
.topbar{position:sticky;top:0;z-index:30;background:rgba(242,237,231,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;justify-content:space-between}
.logo{font-family:var(--head);font-weight:800;font-size:19px;color:var(--espresso);white-space:nowrap;line-height:1.1}
.logo small{display:block;font-family:var(--body);font-weight:600;font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--coral)}
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.steps::-webkit-scrollbar{display:none}
.steps button{font-size:13px;padding:5px 11px;border-radius:99px;border:2px solid var(--line);background:#fff;color:var(--muted);white-space:nowrap;cursor:pointer;min-height:34px}
.steps button.done{background:var(--gold-soft);border-color:var(--gold);color:var(--espresso)}
.steps button.done .sn::after{content:" ✓"}
.steps button.on{background:var(--espresso);border-color:var(--espresso);color:#fff;box-shadow:0 0 0 3px var(--gold-soft);cursor:default}
.steps button.locked{background:#f6f2ec;border-style:dashed;color:#9a8b7c}
.steps button.locked .sn::before{content:"🔒︎ ";font-size:10px}
.steps button:focus-visible,.btn:focus-visible,.pick:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
main{max-width:1080px;margin:0 auto;padding:22px 20px 120px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--coral);margin-bottom:6px}
.substeps{font-size:13px;color:var(--muted);margin-bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.substeps .bar{flex:1 1 120px;height:6px;background:var(--cream);border-radius:9px;overflow:hidden;max-width:260px}
.substeps .bar i{display:block;height:100%;background:var(--coral);border-radius:9px;transition:width .3s}
.lede{font-size:18px;max-width:720px}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 14px 34px -26px rgba(77,59,45,.45)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{margin-bottom:14px}.field label{display:block;font-weight:600;font-size:14px;margin-bottom:5px;color:var(--espresso)}
input[type=text],input[type=date],input[type=time],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;font-size:16px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:focus,textarea:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-soft)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:6px;font-weight:400!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:99px;border:0;background:var(--coral);color:#fff;font-weight:700;cursor:pointer;font-size:15px;min-height:46px;text-decoration:none;font-family:var(--head)}
.btn:hover{filter:brightness(.95)}
.btn.dark{background:var(--espresso)}
.btn.ghost{background:transparent;color:var(--espresso);border:1.5px solid var(--gold)}
.btn.small{padding:8px 14px;min-height:38px;font-size:13.5px}
.btn[aria-disabled=true]{background:#d9cfc2;color:#7a6c5f;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Echo */
.echo{display:flex;gap:12px;align-items:flex-start;margin:16px 0;max-width:760px}
.echo .av{flex:0 0 40px;height:40px;border-radius:50%;background:var(--espresso);display:grid;place-items:center;box-shadow:0 0 0 3px var(--gold-soft)}
.echo .av svg{width:22px;height:22px}
.echo .bub{background:#fff;border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 16px;font-size:15.5px}
.echo .bub b.nm{display:block;font-family:var(--head);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--coral);margin-bottom:2px}
.echo .bub p{margin:.2em 0}
.echo.reflect .bub{background:var(--gold-soft);border-color:var(--gold)}
/* pick cards / chips */
.pick{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #b9a893;border-radius:14px;padding:14px 16px;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s}
.pick:hover{border-color:var(--espresso);transform:translateY(-1px)}
.pick.on{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-soft);background:#fff7f4}
.pick b{display:block;font-family:var(--head);color:var(--espresso);font-size:16px}
.pick span{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #b9a893;background:#fff;border-radius:99px;padding:8px 14px;cursor:pointer;font-size:14.5px;min-height:40px}
.chip.on{background:var(--espresso);border-color:var(--espresso);color:#fff}
.chip.on::before{content:"✓ "}
.chip.static{cursor:default;background:var(--cream);border-color:var(--cream)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--cream);color:var(--espresso)}
.tag.coral{background:var(--coral-soft);color:#9b2d1f}
.tag.ok{background:#e0ecd9;color:#2f5a22}
/* chart tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .k{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
.tile .v{font-family:var(--head);font-weight:800;color:var(--espresso);font-size:17px}
.tile .s{font-size:13px;color:var(--muted)}
.tile.na .v{color:#a39484;font-weight:600;font-size:14px}
/* archetype reveal */
.hero{background:radial-gradient(circle at 85% 15%,rgba(223,70,51,.55),transparent 55%),linear-gradient(135deg,#2a1d14,var(--espresso));color:#fff;border-radius:24px;padding:34px;position:relative;overflow:hidden}
.hero h1,.hero h2{color:#fff}.hero .eyebrow{color:var(--gold)}
.hero .iam{font-size:19px;font-style:italic;max-width:640px;color:#f7ece0}
.hero .wave{position:absolute;right:-20px;bottom:-14px;opacity:.18;width:280px}
.reveal-in{animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.react{display:flex;gap:6px;margin-top:10px}
.react button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer;min-height:34px}
.react button.on.yes{background:#e0ecd9;border-color:#7da56b}
.react button.on.no{background:#f3e1dc;border-color:#c98a7c}
.mag h3,.rep h3{margin-bottom:4px}
.rep{background:#faf6f0}
/* timeline */
.timeline{position:relative;padding-left:34px}
.timeline::before{content:"";position:absolute;left:13px;top:6px;bottom:6px;width:3px;background:var(--cream);border-radius:3px}
.station{position:relative;margin-bottom:16px}
.station .dot{position:absolute;left:-34px;top:16px;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--cream);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted)}
.station.done .dot{background:var(--gold);border-color:var(--gold);color:#fff}
.station.active .dot{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 0 0 5px var(--coral-soft)}
.station.locked{opacity:.55}
.station .card{padding:16px 18px}
.station h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.verse{font-size:15.5px;line-height:1.6;background:#fffaf2;border-left:4px solid var(--gold);padding:10px 14px;border-radius:0 10px 10px 0;margin-top:8px}
.ramble-tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.mic{background:#fff;border:1.5px dashed var(--coral);color:var(--coral)}
.mic.rec{background:var(--coral);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--coral-soft)}}
.evidence{margin-top:8px;font-size:13.5px}
.evidence .chip{font-size:13px;min-height:32px;padding:5px 11px}
.fullcircle{display:flex;gap:10px;align-items:center;background:#eef5ea;border:1px solid #b9d3ac;border-radius:14px;padding:12px 14px;margin-top:10px;font-size:14.5px}
/* codes */
.codes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.code{background:#fff;border:1.5px solid #c9b9a4;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;transition:.15s}
.code .n{font-size:11.5px;font-weight:800;letter-spacing:1.5px;color:var(--coral)}
.code .stmt{font-family:var(--head);font-weight:800;font-size:18px;color:var(--espresso);line-height:1.25}
.code .ln{font-size:13.5px;color:var(--muted)}.code .ln b{color:var(--espresso)}
.code.keep{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-soft)}
.code.skip{opacity:.5;background:#f6f2ec}
.code .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.code .acts button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13.5px;cursor:pointer;min-height:36px}
.code .acts button.on.k{background:var(--coral);border-color:var(--coral);color:#fff}
.code .acts button.on.s{background:var(--espresso);border-color:var(--espresso);color:#fff}
.alts{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.alts button{text-align:left;border:1px dashed var(--gold);background:#fffaf2;border-radius:10px;padding:7px 10px;font-size:14px;cursor:pointer}
.alts button.on{border-style:solid;border-color:var(--coral);background:#fff3ef}
.counter{position:sticky;top:64px;z-index:5;background:var(--paper);padding:8px 0;margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600}
.counter .pips{display:flex;gap:4px}.counter .pips i{width:16px;height:16px;border-radius:50%;border:2px solid var(--coral);display:block}.counter .pips i.f{background:var(--coral)}
/* collectible cards */
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;perspective:1200px}
.cc{height:300px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .7s;border:0;background:none;padding:0;text-align:left}
.cc.flip{transform:rotateY(180deg)}
.cc .face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:20px;display:flex;flex-direction:column;overflow:hidden}
.cc .front{background:linear-gradient(160deg,#3a2b20,var(--espresso) 60%,#6a4c35);color:#fff;border:3px solid var(--gold)}
.cc .front .no{font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:800}
.cc .front .stmt{font-family:var(--head);font-weight:800;font-size:22px;line-height:1.2;margin-top:auto;margin-bottom:auto}
.cc .front .hint{font-size:12px;color:var(--gold)}
.cc .front .seal{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-size:18px}
.cc .back{background:#fffaf2;border:3px solid var(--coral);transform:rotateY(180deg);font-size:13.5px;gap:6px}
.cc .back b{color:var(--coral);font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase}
.cc.sealed .front{background:repeating-linear-gradient(45deg,#3a2b20 0 14px,#45342a 14px 28px);}
.cc.sealed .front .stmt{filter:blur(6px)}
/* broadcast hub */
.hub{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.dtile{background:#fff;border:1.5px solid #c9b9a4;border-radius:16px;padding:14px;text-align:left;cursor:pointer;min-height:110px;display:flex;flex-direction:column;gap:6px}
.dtile .ic{font-size:22px}.dtile b{font-family:var(--head);color:var(--espresso);font-size:15px;line-height:1.2}
.dtile.open{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-soft)}
.dtile.ok{background:#f3f8ef;border-color:#9cc08a}
.opt{background:#fff;border:1.5px solid #b9a893;border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;display:block}
.opt.on{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-soft)}
.opt pre{white-space:pre-wrap;font-family:var(--body);font-size:16px;margin:6px 0;color:var(--ink)}
.count{font-size:12.5px;font-weight:700}.count.okc{color:#2f5a22}.count.bad{color:#b0301f}
.acc{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px}
.acc summary{cursor:pointer;padding:12px 14px;font-family:var(--head);font-weight:700;color:var(--espresso);list-style:none;display:flex;justify-content:space-between}
.acc summary::after{content:"+";color:var(--coral);font-weight:800}
.acc[open] summary::after{content:"–"}
.acc p{margin:0;padding:0 14px 12px;font-size:15px}
.hook{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--cream)}
.hook .star{border:0;background:none;font-size:20px;cursor:pointer;color:#c9b9a4;line-height:1;padding:2px}
.hook .star.on{color:var(--coral)}
.hook small{display:block;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
/* quiz */
.quiz-q{font-family:var(--head);font-weight:800;font-size:clamp(22px,3.2vw,30px);color:var(--espresso);margin:6px 0 14px;max-width:720px}
.quiz-opts{display:grid;gap:10px;max-width:720px}
.qbar{height:6px;background:var(--cream);border-radius:9px;max-width:720px;margin-bottom:16px}.qbar i{display:block;height:100%;background:var(--coral);border-radius:9px;transition:width .3s}
/* bundle */
.bundle-hero{background:linear-gradient(135deg,var(--espresso),#2a1d14);color:#fff;border-radius:24px;padding:32px;position:relative;overflow:hidden}
.bundle-hero h1{color:#fff}.bundle-hero .eyebrow{color:var(--gold)}
.bundle-hero .chip.static{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.piece{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:14px;break-inside:avoid}
.piece .pn{font-family:var(--head);font-weight:800;color:var(--coral);font-size:13px;letter-spacing:1.5px}
.piece.skipped{background:#f6f2ec;border-style:dashed}
.piece pre{white-space:pre-wrap;font-family:var(--body);font-size:16px;margin:6px 0}
.mini-codes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mini-codes span{background:var(--coral);color:#fff;border-radius:10px;padding:6px 10px;font-family:var(--head);font-weight:700;font-size:13.5px}
.export{position:relative}
.menu{position:absolute;right:0;top:110%;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 40px -20px rgba(0,0,0,.35);padding:6px;min-width:250px;z-index:40}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;cursor:pointer;font-size:15px}
.menu button:hover{background:var(--paper)}

.navbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(242,237,231,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.navbar-in{max-width:1080px;margin:0 auto;padding:10px 20px calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:space-between}
.navbar .why{font-size:13.5px;color:var(--muted);flex:1;text-align:right}
.navbar .btn.next{min-width:200px}
.skiplink{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13.5px;padding:6px}

.echo-fab{position:fixed;right:18px;bottom:84px;z-index:26;border-radius:99px;background:var(--espresso);color:#fff;border:0;padding:10px 16px 10px 10px;display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);font-family:var(--head);font-size:14px}
.echo-fab .av{width:30px;height:30px;border-radius:50%;background:var(--coral);display:grid;place-items:center}

.drawer.open{transform:none}
.drawer header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer .log{flex:1;overflow-y:auto;padding:6px 14px}
.drawer .log .me{margin:10px 0 10px auto;max-width:80%;background:var(--espresso);color:#fff;border-radius:18px 4px 18px 18px;padding:10px 14px;width:fit-content}
.drawer form{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.drawer form input{flex:1}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:45}
.dlg{position:fixed;inset:0;display:grid;place-items:center;z-index:60;background:rgba(43,33,26,.45);padding:20px}
.dlg .box{background:var(--card);border-radius:20px;padding:24px;max-width:440px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--espresso);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.closing{background:var(--gold-soft);border:1px solid var(--gold);border-radius:18px;padding:18px 20px;margin-top:16px}
.foot{text-align:center;font-size:12.5px;color:var(--muted);margin-top:40px}
@media (max-width:860px){
  .hub{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:1fr}
}
@media (max-width:640px){
  body{font-size:15.5px}
  .topbar-in{flex-wrap:wrap;gap:6px;padding:8px 14px}
  .steps{flex:1 1 100%}
  .steps button{font-size:12px;padding:4px 9px;min-height:32px}
  .steps button:not(.on) .sl{display:none}
  main{padding:16px 14px 130px}
  .g2,.codes{grid-template-columns:1fr}
  .panel,.card{padding:16px;border-radius:16px}
  .hero,.bundle-hero{padding:22px;border-radius:20px}
  .navbar-in{padding:8px 14px calc(8px + env(safe-area-inset-bottom));flex-wrap:wrap;gap:6px}
  .navbar .why{flex:1 1 100%;order:-1;text-align:center;font-size:12.5px}
  .navbar .btn.next{flex:1;min-width:0}
  .counter{top:86px}
  .echo-fab{bottom:118px;right:12px;padding:8px}
  .echo-fab .lbl{display:none}
  .cc{height:280px}
}
@media print{
  .topbar,.navbar,.echo-fab,.proto-flag,.noprint,.drawer,.scrim{display:none!important}
  body{background:#fff}main{padding:0}
  .bundle-hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

document.addEventListener("click",e=>{const t=e.target.closest("button,[data-stage]");if(!t)return;const ds=t.dataset;
 if(t.id==="nextBtn")return next(); if(t.id==="backBtn")return back();
 if(t.id==="restart")return dialog("Start over?","This clears the sample answers in this tab.","Keep my Bundle","Start over",()=>{S=fresh();save();go(0)});
 if(ds.stage)return jumpStage(+ds.stage);
 if(t.id==="fillSample"){fillThrough(0);S.reached=Math.max(S.reached,0);save();render();return}
 if(t.id==="chartYes"){S.chartOk=true;S.chartFix=false;save();render();return}
 if(t.id==="chartFix"){S.chartFix=true;S.chartOk=false;save();render();return}
 if(ds.react){S.react[ds.react]=S.react[ds.react]===ds.v?null:ds.v;save();render();return}
 if(ds.kw){const k=ds.kw,i=S.keywords.indexOf(k);if(i>=0)S.keywords.splice(i,1);else{if(S.keywords.length>=5){toast("You have 5. Tap one to drop it first.");return}S.keywords.push(k)}save();render();return}
 if(ds.origin!=null){S.origin=+ds.origin;save();render();setTimeout(()=>{if(cur().id==="s2-begin")go(S.i+1)},450);return}
 if(t.id==="useSample"){const s=STATIONS[S.stIdx];S.st[s.id]=Object.assign(S.st[s.id]||{},{text:s.ramble});save();render();return}
 if(t.id==="mic"){t.classList.add("rec");t.textContent="● Listening… (mock)";setTimeout(()=>{const s=STATIONS[S.stIdx];S.st[s.id]=Object.assign(S.st[s.id]||{},{text:s.ramble});save();render()},1200);return}
 if(t.id==="organize"){const s=STATIONS[S.stIdx];const d=S.st[s.id]||{};if(!(d.text||"").trim()){toast("Ramble a little first, or use the sample.");return}
   t.textContent="Echo is organizing…";t.setAttribute("aria-disabled","true");setTimeout(()=>{S.st[s.id]=Object.assign(d,{done:true,skipped:false});S.stIdx=Math.min(4,S.stIdx+1);while(S.stIdx<4&&S.st[STATIONS[S.stIdx].id]&&S.st[STATIONS[S.stIdx].id].done)S.stIdx++;save();render()},700);return}
 if(t.id==="skipSt"){const s=STATIONS[S.stIdx];S.st[s.id]={done:true,skipped:true};S.stIdx++;save();render();return}
 if(ds.redo!=null){const i=+ds.redo;S.st[STATIONS[i].id].done=false;S.stIdx=i;save();render();return}
 if(ds.priv){const i=S.priv.indexOf(ds.priv);i>=0?S.priv.splice(i,1):S.priv.push(ds.priv);save();render();return}
 if(t.id==="approveStory"){S.storyOk=true;save();render();return}
 if(t.id==="sharpen"||ds.sharpen){toast("In the full version, this opens a short back-and-forth with Echo.");return}
 if(ds.code!=null){const i=+ds.code;S.codes[i]=S.codes[i]===ds.v?null:ds.v;save();render();return}
 if(ds.reword!=null){S.openAlt=S.openAlt===+ds.reword?null:+ds.reword;save();render();return}
 if(ds.alt!=null){const i=+ds.alt,ai=+ds.ai;S.alt[i]=ai<0?null:ai;save();render();return}
 if(ds.flip!=null){S.flipped[ds.flip]=!S.flipped[ds.flip];save();render();return}
 if(ds.quick!=null){const v=+ds.quick;if(S.qi===0)S.offer=v;else S.cta=v;save();render();setTimeout(()=>{if(cur().id!=="s4-quick")return;if(S.qi===0){S.qi=1;save();render()}else go(S.i+1)},450);return}
 if(ds.deliv){S.openD=S.openD===ds.deliv?null:ds.deliv;window._scrollPanel=true;save();render();return}
 if(ds.pick){S.d[ds.pick]=Object.assign(S.d[ds.pick]||{},{pick:+ds.i});save();render();return}
 if(ds.star){const o=S.d.hooks=S.d.hooks||{};o.stars=o.stars||[];const i=o.stars.indexOf(ds.star);i>=0?o.stars.splice(i,1):o.stars.push(ds.star);save();render();return}
 if(ds.approve){if(t.getAttribute("aria-disabled")==="true"){toast("Pick an option first.");return}S.d[ds.approve]=Object.assign(S.d[ds.approve]||{},{ok:true});
   const nextOpen=DELIV.find(d=>!(S.d[d.id]&&S.d[d.id].ok));S.openD=nextOpen?nextOpen.id:null;window._scrollPanel=!!nextOpen;toast("Approved ✓"+(nextOpen?" Next up: "+nextOpen.t:" All five done!"));save();render();return}
 if(t.id==="toHub"){go(SCREENS.findIndex(s=>s.id==="s4-hub"));return}
 if(ds.gotoDeliv){S.openD=ds.gotoDeliv;go(SCREENS.findIndex(s=>s.id==="s4-hub"));return}
 if(t.id==="exp"){const m=$("#expMenu");m.hidden=!m.hidden;return}
 if(t.id==="dlHtml"){downloadHtml();$("#expMenu").hidden=true;return}
 if(t.id==="dlPrint"){$("#expMenu").hidden=true;window.print();return}
 if(t.id==="dlCopy"){const txt=$("#app").innerText;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Copied ✓"),()=>toast("Copy not available here"));$("#expMenu").hidden=true;return}
 if(t.id==="echoFab"){openDrawer(true);return} if(t.id==="drawerClose"){openDrawer(false);return}
});
function downloadHtml(){const css=document.querySelector("style#fyfcss").textContent.replace(/@font-face\{[^}]*\}/g,"");
 const doc=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${nm()}'s Brand Broadcast Bundle</title><style>${css} .noprint{display:none!important}</style></head><body><main>${$("#app").innerHTML}</main></body></html>`;
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([doc],{type:"text/html"}));a.download=(S.name||"My")+"-Brand-Broadcast-Bundle.html";document.body.appendChild(a);a.click();a.remove();toast("Bundle downloaded (sample)")}
// ---- Echo drawer: the conversation stays available at every step (scripted in this prototype)
function openDrawer(on){$("#drawer").classList.toggle("open",on);$("#scrim").hidden=!on;if(on){renderLog();setTimeout(()=>$("#chatIn").focus(),200)}}
function renderLog(){const sc=cur();$("#log").innerHTML=echo([`You're in <b>${STAGES[sc.stage].n}</b> · ${h(sc.label)}.`,`Ask me anything, ramble, or tell me to jump to another stage or piece. I'll pick up from wherever you are.`])+S.chat.map(m=>m.me?`<div class="me">${h(m.t)}</div>`:echo(m.t)).join("");$("#log").scrollTop=1e6}
document.addEventListener("submit",e=>{if(e.target.id!=="chatForm")return;e.preventDefault();const v=$("#chatIn").value.trim();if(!v)return;$("#chatIn").value="";S.chat.push({me:1,t:v});
 S.chat.push({t:`Love that you asked. 🎶 <em>(Prototype: in the real version, Echo answers here live, using everything you've built so far.)</em>`});save();renderLog()});
$("#scrim").addEventListener("click",()=>openDrawer(false));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){openDrawer(false);const d=$(".dlg");if(d)d.remove();const m=$("#expMenu");if(m)m.hidden=true}});

// ---- boot: ?at=<screen-id> jumps there with sample data (for screenshots and demos); ?reset clears
const qs=new URLSearchParams(location.search);
if(qs.has("reset")){S=fresh();save()}
if(qs.get("at")){const i=SCREENS.findIndex(s=>s.id===qs.get("at"));if(i>=0){S=fresh();fillThrough(i-1);S.i=i;if(qs.get("open"))S.openD=qs.get("open");if(qs.get("flip")){keptCodes().forEach(c=>S.flipped[c.i]=true)}if(qs.get("st")!=null){const n=+qs.get("st");STATIONS.forEach((s,k)=>{if(k>=n)delete S.st[s.id];else S.st[s.id]={text:s.ramble,done:true}});S.stIdx=n}if(qs.get("q"))S.qi=+qs.get("q");if(qs.get("blank")){S.offer=null;S.cta=null;S.origin=null}save()}}
else{const hi=SCREENS.findIndex(s=>"#"+s.id===location.hash);if(hi>=0&&hi<=S.reached)S.i=hi}
history.replaceState({i:S.i},"",location.pathname+"#"+cur().id);render();
})();
</script>
</body></html>
